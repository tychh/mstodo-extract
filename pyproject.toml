[project]
name = "mstodo-extract"
version = "0.9.1"
description = "MSToDo Extract: export Microsoft To Do to Super Productivity backups and source JSON"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["httpx>=0.28,<1", "tzdata>=2025.1", "tzlocal>=5.3,<6"]

[project.scripts]
mstodo-extract = "mstodo_extract.cli:main"

[project.urls]
Repository = "https://github.com/tychh/mstodo-extract"
Issues = "https://github.com/tychh/mstodo-extract/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mstodo_extract"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
